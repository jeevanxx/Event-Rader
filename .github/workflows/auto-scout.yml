name: Daily automatic event check
# Runs every day at 3:47 AM IST (22:17 UTC) on GitHub's free runners; GitHub may start it a few hours late. No Claude needed.
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/auto-scout.mjs, .github/workflows/auto-scout.yml]
permissions:
  contents: write
  issues: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find events and save
        id: save
        run: |
          git config user.name "event-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # If someone else updates the data while we run, start again from their version (up to 3 tries).
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            echo "BEFORE_SHA=$(git rev-parse HEAD)" > "$RUNNER_TEMP/before"
            node scripts/auto-scout.mjs
            python3 -m json.tool data/events.json > /dev/null
            if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git add data/
            git commit -q -m "Automatic event check $(TZ=Asia/Kolkata date +'%-d %b %Y')"
            if git push -q origin HEAD:main; then
              cat "$RUNNER_TEMP/before" >> "$GITHUB_ENV"
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Data changed while running (attempt $attempt); retrying from the latest version."
            sleep 10
          done
          echo "Could not save after 3 attempts."; exit 1
      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so send the alert here.
      - name: Send alert
        if: steps.save.outputs.changed == 'true'
        run: node scripts/notify.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUB_PRIVATE_KEY: ${{ secrets.SUB_PRIVATE_KEY }}
