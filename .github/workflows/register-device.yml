name: Register device for alerts
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  register:
    if: startsWith(github.event.issue.title, 'push-subscribe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/register.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUB_PRIVATE_KEY: ${{ secrets.SUB_PRIVATE_KEY }}
