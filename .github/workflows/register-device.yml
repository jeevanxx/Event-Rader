name: Register device for alerts
on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/register-device.yml]
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency:
  group: register
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'push-subscribe')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/register.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUB_PRIVATE_KEY: ${{ secrets.SUB_PRIVATE_KEY }}
